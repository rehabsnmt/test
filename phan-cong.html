<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quản lý Phân công giảng dạy - Bộ môn Phục hồi chức năng.">

    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
            default-src 'self';
            connect-src 'self' https://*.supabase.co;
            img-src 'self' data: https://*.supabase.co;
            style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net;
            script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
            font-src 'self' https://cdnjs.cloudflare.com;
        ">

    <title>Phân công giảng dạy - Bộ môn Phục hồi chức năng</title>

    <link rel="icon" href="images/logo_Bộ môn.png" type="image/png">
    
    <!-- CSS dùng chung -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .filter-section {
            display: flex;
            gap: 1rem;
            align-items: flex-end;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .filter-section .form-group {
            margin-bottom: 0;
            flex: 1;
            min-width: 250px;
        }
        .action-column {
            width: 150px;
        }
        .modal-overlay {
            z-index: 9999;
        }

        /* ----- CSS CHO DÒNG CHI TIẾT ----- */
        .detail-row {
            background-color: var(--bg-page);
            display: none; /* Ẩn mặc định */
        }
        .detail-content {
            padding: 1.5rem;
            text-align: left;
            border-bottom: 2px solid var(--border);
        }
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px dashed var(--border);
        }
        .detail-item span {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }
        .detail-item strong {
            color: var(--text-dark);
            font-size: 0.95rem;
        }
        .assignment-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .assignment-item {
            display: flex;
            align-items: center;
            background: var(--surface);
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-bottom: 0.5rem;
            gap: 1rem;
        }
        .assignment-item i {
            color: var(--primary);
            font-size: 1.2rem;
        }
        .btn-toggle {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-body);
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-toggle:hover {
            background: var(--border-light);
            color: var(--primary);
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <div id="header-placeholder"></div>

    <!-- TOAST -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- MAIN CONTENT -->
    <main style="opacity: 0; transition: opacity 0.3s ease;">
        
        <div class="section-title" style="margin-top: 1rem;">
            <h1>Phân công <span class="title-break">Giảng dạy</span></h1>
            <div class="section-divider"></div>
        </div>

        <div class="container">
            <!-- Khu vực Bộ lọc -->
            <div class="card">
                <div class="filter-section">
                    <div class="form-group">
                        <label for="classSelect">Chọn Lớp học</label>
                        <select id="classSelect">
                            <option value="">-- Đang tải danh sách lớp --</option>
                        </select>
                    </div>
                </div>
                <div id="curriculumInfo" style="margin-top: 10px; font-size: 0.85rem; color: var(--text-muted); display: none;">
                    Chương trình đào tạo: <strong id="curriculumNameText">...</strong>
                </div>
            </div>

            <!-- Bảng Học phần -->
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h3>Danh sách Học phần</h3>
                </div>

                <div class="table-responsive">
                    <table id="modulesTable">
                        <thead>
                            <tr>
                                <th style="width: 50px;">STT</th>
                                <th>Tên Học phần</th>
                                <th>Chuyên ngành</th>
                                <th>Giảng viên phụ trách</th>
                                <th class="action-column">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="modulesTableBody">
                            <tr>
                                <td colspan="5" class="text-center">Vui lòng chọn lớp học để xem chương trình.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- ==============================================
         MODAL PHÂN CÔNG GIẢNG VIÊN
    =============================================== -->
    <div id="assignModal" class="modal-overlay hidden">
        <div class="modal-content" style="max-width: 500px; text-align: left;">
            <button class="modal-close" id="btnCloseModal" aria-label="Đóng"><i class="fas fa-times"></i></button>
            
            <h3 style="margin-bottom: 0.5rem; text-align: center;">Phân công Giảng viên</h3>
            <p id="modalModuleInfo" style="text-align: center; color: var(--primary); font-weight: 600; margin-bottom: 1.5rem;"></p>

            <form id="assignForm">
                <div class="form-group">
                    <label for="instructorSelect">Chọn Giảng viên <span class="text-danger">*</span></label>
                    <select id="instructorSelect" required>
                        <option value="">-- Đang tải giảng viên --</option>
                    </select>
                </div>

                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label for="theorySessions">Số buổi Lý thuyết (LT) <span class="text-danger">*</span></label>
                        <input type="number" id="theorySessions" min="0" value="0" required style="max-width: 100%;">
                        <small id="hintLT" class="text-muted">Tối đa: 0 buổi</small>
                    </div>

                    <div class="form-group" style="flex: 1;">
                        <label for="practiceSessions">Số buổi Thực hành (TH) <span class="text-danger">*</span></label>
                        <input type="number" id="practiceSessions" min="0" value="0" required style="max-width: 100%;">
                        <small id="hintTH" class="text-muted">Tối đa: 0 buổi</small>
                    </div>
                </div>

                <div style="margin-top: 1.5rem; display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" class="btn-warning" id="btnCancelModal" style="color: #fff; background: var(--text-muted);">Hủy</button>
                    <button type="submit" class="btn-primary" id="btnSaveAssignment">
                        <i class="fas fa-save"></i> Lưu phân công
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- FOOTER -->
    <div id="footer-placeholder"></div>

    <!-- TẢI GIAO DIỆN CHUNG & AUTH SUPABASE -->
    <script src="js/layout.js"></script>

    <!-- SCRIPT CHÍNH CHO TRANG PHÂN CÔNG -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            /* =================================================
               HÀM HIỂN THỊ THÔNG BÁO (TOAST)
            ================================================= */
            window.showToast = function (message, isError = false) {
                const container = document.getElementById("toastContainer");
                if (!container) return;
                const toast = document.createElement("div");
                toast.className = "toast";
                if (isError) toast.style.borderLeftColor = "var(--accent)";
                
                const iconClass = isError ? "fas fa-exclamation-circle" : "fas fa-check-circle";
                const iconColor = isError ? "var(--accent)" : "#16a34a";

                toast.innerHTML = `<i class="${iconClass}" style="color: ${iconColor};"></i><span>${message}</span>`;
                container.appendChild(toast);
                requestAnimationFrame(() => toast.classList.add("show"));
                setTimeout(() => {
                    toast.classList.remove("show");
                    setTimeout(() => toast.remove(), 400);
                }, 3000);
            };

            function escapeHtml(value) {
                if (value == null) return "";
                return String(value)
                    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
            }

            /* =================================================
               BIẾN TOÀN CỤC & ELEMENT
            ================================================= */
            let classesList = [];
            let instructorsList = [];
            let currentSelectedClass = null; 
            let currentSelectedModule = null; 
            
            // Lưu trữ dữ liệu đang hiển thị để tiện tải lại
            let currentCurriculumData = [];
            let currentAssignmentsData = [];

            const classSelect = document.getElementById("classSelect");
            const curriculumInfo = document.getElementById("curriculumInfo");
            const curriculumNameText = document.getElementById("curriculumNameText");
            const modulesTableBody = document.getElementById("modulesTableBody");

            // Modal elements
            const assignModal = document.getElementById("assignModal");
            const assignForm = document.getElementById("assignForm");
            const instructorSelect = document.getElementById("instructorSelect");
            const theorySessions = document.getElementById("theorySessions");
            const practiceSessions = document.getElementById("practiceSessions");
            const hintLT = document.getElementById("hintLT");
            const hintTH = document.getElementById("hintTH");
            const btnCloseModal = document.getElementById("btnCloseModal");
            const btnCancelModal = document.getElementById("btnCancelModal");
            const btnSaveAssignment = document.getElementById("btnSaveAssignment");
            const modalModuleInfo = document.getElementById("modalModuleInfo");

            /* =================================================
               1. LẤY DỮ LIỆU BAN ĐẦU
            ================================================= */
            async function loadInitialData() {
                try {
                    const supabase = window.supabaseClient;

                    // 1. Danh sách lớp
                    const { data: classData, error: classError } = await supabase
                        .from('lop-hoc')
                        .select('ma-lop, ten-lop, chuong-trinh');
                    if (classError) throw classError;
                    classesList = classData || [];

                    classSelect.innerHTML = `<option value="">-- Chọn Lớp học --</option>`;
                    classesList.forEach(cls => {
                        const option = document.createElement("option");
                        option.value = cls["ma-lop"];
                        option.textContent = `${cls["ma-lop"]} - ${cls["ten-lop"]}`;
                        classSelect.appendChild(option);
                    });

                    // 2. Danh sách giảng viên
                    const { data: instData, error: instError } = await supabase
                        .from('giang-vien')
                        .select('ma-giang-vien, ho-ten')
                        .order('ho-ten', { ascending: true });
                    if (instError) throw instError;
                    instructorsList = instData || [];

                    instructorSelect.innerHTML = `<option value="">-- Chọn Giảng viên --</option>`;
                    instructorsList.forEach(inst => {
                        const option = document.createElement("option");
                        option.value = inst["ma-giang-vien"];
                        option.textContent = `${inst["ho-ten"]} (${inst["ma-giang-vien"]})`;
                        instructorSelect.appendChild(option);
                    });

                } catch (error) {
                    console.error("Lỗi lấy dữ liệu ban đầu:", error);
                    window.showToast("Lỗi khi kết nối CSDL.", true);
                }
            }

            // Tiện ích lấy tên GV từ mã
            function getInstructorName(maGv) {
                const gv = instructorsList.find(i => i["ma-giang-vien"] === maGv);
                return gv ? gv["ho-ten"] : maGv;
            }

            /* =================================================
               2. TẢI DỮ LIỆU BẢNG & PHÂN CÔNG (KHI CHỌN LỚP)
            ================================================= */
            classSelect.addEventListener("change", () => {
                loadClassData();
            });

            async function loadClassData() {
                const maLop = classSelect.value;
                if (!maLop) {
                    currentSelectedClass = null;
                    curriculumInfo.style.display = "none";
                    modulesTableBody.innerHTML = `<tr><td colspan="5" class="text-center">Vui lòng chọn lớp học để xem chương trình.</td></tr>`;
                    return;
                }

                currentSelectedClass = classesList.find(c => c["ma-lop"] === maLop);
                const tableName = currentSelectedClass["chuong-trinh"];

                if (!tableName) {
                    window.showToast("Lớp học này chưa được gán mã bảng chương trình.", true);
                    return;
                }

                curriculumNameText.textContent = tableName;
                curriculumInfo.style.display = "block";
                modulesTableBody.innerHTML = `<tr><td colspan="5" class="text-center"><i class="fas fa-spinner fa-spin"></i> Đang tải dữ liệu...</td></tr>`;

                try {
                    const supabase = window.supabaseClient;
                    
                    // A. Tải Chương trình học
                    const { data: curriculumData, error: curError } = await supabase
                        .from(tableName)
                        .select('*')
                        .order('stt', { ascending: true });
                    if (curError) throw curError;
                    currentCurriculumData = curriculumData || [];

                    // B. Tải các phân công đã có của lớp này
                    const { data: assignData, error: assignError } = await supabase
                        .from('phan-cong-giang-day')
                        .select('*')
                        .eq('ma-lop', maLop);
                    if (assignError) throw assignError;
                    currentAssignmentsData = assignData || [];

                    // Render bảng
                    renderModulesTable();

                } catch (error) {
                    console.error("Lỗi tải chương trình/phân công:", error);
                    modulesTableBody.innerHTML = `<tr><td colspan="5" class="text-center text-danger">Lỗi tải dữ liệu. Bảng "${escapeHtml(tableName)}" có thể chưa tồn tại.</td></tr>`;
                }
            }

            /* =================================================
               3. RENDER BẢNG HỌC PHẦN (VỚI DÒNG CHI TIẾT)
            ================================================= */
            function renderModulesTable() {
                modulesTableBody.innerHTML = "";

                if (currentCurriculumData.length === 0) {
                    modulesTableBody.innerHTML = `<tr><td colspan="5" class="text-center">Chương trình học trống.</td></tr>`;
                    return;
                }

                currentCurriculumData.forEach((mod, index) => {
                    const maHp = escapeHtml(mod["ma-hoc-phan"] || "");
                    const tenHp = escapeHtml(mod["ten-hoc-phan"] || "");
                    const rowId = `module-${index}`;

                    // Lọc các phân công thuộc học phần này
                    const moduleAssignments = currentAssignmentsData.filter(a => a["ma-hoc-phan"] === mod["ma-hoc-phan"]);
                    
                    // Tạo chuỗi tóm tắt GV
                    let gvSummaryHtml = `<span class="text-muted">Chưa phân công</span>`;
                    if (moduleAssignments.length > 0) {
                        const gvNames = moduleAssignments.map(a => escapeHtml(getInstructorName(a["ma-giang-vien"])));
                        gvSummaryHtml = `<strong>${gvNames.join(', ')}</strong>`;
                    }

                    // --- HTML DÒNG CHÍNH ---
                    const mainTr = document.createElement("tr");
                    mainTr.innerHTML = `
                        <td>${escapeHtml(mod["stt"] || "")}</td>
                        <td class="text-left" style="font-weight: 600; color: var(--primary);">${tenHp}</td>
                        <td>${escapeHtml(mod["chuyen-nganh"] || "")}</td>
                        <td class="text-left" style="max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="Đã phân công ${moduleAssignments.length} GV">
                            ${gvSummaryHtml}
                        </td>
                        <td>
                            <div style="display: flex; gap: 5px; justify-content: center;">
                                <button class="btn-toggle" onclick="toggleDetails('${rowId}')" title="Xem chi tiết">
                                    <i id="icon-${rowId}" class="fas fa-chevron-down"></i>
                                </button>
                                <button class="btn-primary" style="padding: 4px 10px; font-size: 0.75rem;" 
                                    onclick="openAssignModal('${maHp}', '${tenHp}', ${mod["so-buoi-ly-thuyet"] || 0}, ${mod["so-buoi-thuc-hanh"] || 0})">
                                    Phân công
                                </button>
                            </div>
                        </td>
                    `;
                    modulesTableBody.appendChild(mainTr);

                    // --- HTML DÒNG CHI TIẾT (ẨN) ---
                    const detailTr = document.createElement("tr");
                    detailTr.id = `detail-${rowId}`;
                    detailTr.className = "detail-row";
                    
                    // Xây dựng danh sách GV chi tiết
                    let assignListHtml = `<p class="text-muted" style="margin:0; font-size:0.85rem; font-style:italic;">Chưa có giảng viên nào được phân công.</p>`;
                    if (moduleAssignments.length > 0) {
                        assignListHtml = `<ul class="assignment-list">`;
                        moduleAssignments.forEach(a => {
                            assignListHtml += `
                                <li class="assignment-item">
                                    <i class="fas fa-user-circle"></i>
                                    <div>
                                        <strong>${escapeHtml(getInstructorName(a["ma-giang-vien"]))}</strong> <br>
                                        <span style="font-size: 0.8rem; color: var(--text-body);">
                                            Lý thuyết: <b>${escapeHtml(a["so-buoi-ly-thuyet"])}</b> buổi | Thực hành: <b>${escapeHtml(a["so-buoi-thuc-hanh"])}</b> buổi
                                        </span>
                                    </div>
                                </li>
                            `;
                        });
                        assignListHtml += `</ul>`;
                    }

                    detailTr.innerHTML = `
                        <td colspan="5" style="padding: 0;">
                            <div class="detail-content">
                                <div class="detail-grid">
                                    <div class="detail-item"><span>Mã Học phần</span><strong>${maHp}</strong></div>
                                    <div class="detail-item"><span>Nhóm Học phần</span><strong>${escapeHtml(mod["nhom-hoc-phan"] || "---")}</strong></div>
                                    <div class="detail-item"><span>Tổng Tín chỉ</span><strong>${escapeHtml(mod["tong-tin-chi"] || "0")}</strong></div>
                                    <div class="detail-item"><span>Tổng số Buổi (Kế hoạch)</span><strong>${escapeHtml(mod["tong-so-buoi"] || "0")}</strong></div>
                                    <div class="detail-item"><span>Lý thuyết (Kế hoạch)</span><strong>${escapeHtml(mod["so-buoi-ly-thuyet"] || "0")}</strong></div>
                                    <div class="detail-item"><span>Thực hành (Kế hoạch)</span><strong>${escapeHtml(mod["so-buoi-thuc-hanh"] || "0")}</strong></div>
                                </div>
                                <div>
                                    <h4 style="font-size: 0.95rem; margin-bottom: 0.75rem; color: var(--primary);">Giảng viên đã phân công:</h4>
                                    ${assignListHtml}
                                </div>
                            </div>
                        </td>
                    `;
                    modulesTableBody.appendChild(detailTr);
                });
            }

            // Hàm Mở/Đóng dòng chi tiết
            window.toggleDetails = function(rowId) {
                const detailRow = document.getElementById(`detail-${rowId}`);
                const icon = document.getElementById(`icon-${rowId}`);
                
                if (detailRow.style.display === "none" || detailRow.style.display === "") {
                    detailRow.style.display = "table-row";
                    icon.classList.remove("fa-chevron-down");
                    icon.classList.add("fa-chevron-up");
                } else {
                    detailRow.style.display = "none";
                    icon.classList.remove("fa-chevron-up");
                    icon.classList.add("fa-chevron-down");
                }
            };

            /* =================================================
               4. MODAL PHÂN CÔNG & LƯU
            ================================================= */
            window.openAssignModal = function(maHp, tenHp, maxLT, maxTH) {
                if (!currentSelectedClass) {
                    window.showToast("Lỗi: Không xác định được lớp học.", true);
                    return;
                }

                currentSelectedModule = { maHp, tenHp, maxLT, maxTH };
                modalModuleInfo.textContent = `Học phần: ${maHp} - ${tenHp}`;
                instructorSelect.value = "";
                theorySessions.value = 0;
                practiceSessions.value = 0;
                hintLT.textContent = `CTĐT yêu cầu: ${maxLT} buổi`;
                hintTH.textContent = `CTĐT yêu cầu: ${maxTH} buổi`;

                assignModal.classList.remove("hidden");
            };

            function closeModal() {
                assignModal.classList.add("hidden");
                currentSelectedModule = null;
            }

            btnCloseModal.addEventListener("click", closeModal);
            btnCancelModal.addEventListener("click", closeModal);

            assignForm.addEventListener("submit", async (e) => {
                e.preventDefault();

                if (!currentSelectedClass || !currentSelectedModule) return;

                const maGiangVien = instructorSelect.value;
                const soBuoiLT = parseInt(theorySessions.value) || 0;
                const soBuoiTH = parseInt(practiceSessions.value) || 0;

                if (!maGiangVien) {
                    window.showToast("Vui lòng chọn giảng viên.", true);
                    return;
                }

                if (soBuoiLT === 0 && soBuoiTH === 0) {
                    window.showToast("Cần nhập số buổi Lý thuyết hoặc Thực hành > 0.", true);
                    return;
                }

                const origText = btnSaveAssignment.innerHTML;
                btnSaveAssignment.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Đang lưu...`;
                btnSaveAssignment.disabled = true;

                const maPhanCongMoi = "PC_" + new Date().getTime();

                try {
                    const supabase = window.supabaseClient;

                    const { data, error } = await supabase
                        .from('phan-cong-giang-day')
                        .insert([
                            { 
                                "ma-phan-cong": maPhanCongMoi,
                                "ma-lop": currentSelectedClass["ma-lop"],
                                "ma-hoc-phan": currentSelectedModule.maHp,
                                "ma-giang-vien": maGiangVien,
                                "so-buoi-ly-thuyet": soBuoiLT,
                                "so-buoi-thuc-hanh": soBuoiTH
                            }
                        ]);

                    if (error) throw error;

                    window.showToast("Đã lưu phân công thành công!");
                    closeModal();
                    
                    // Load lại dữ liệu lớp học ngay lập tức để cập nhật bảng
                    loadClassData();

                } catch (error) {
                    console.error("Lỗi khi lưu:", error);
                    window.showToast("Lỗi: " + error.message, true);
                } finally {
                    btnSaveAssignment.innerHTML = origText;
                    btnSaveAssignment.disabled = false;
                }
            });

            /* =================================================
               KHỞI ĐỘNG
            ================================================= */
            function startApp() {
                let attempts = 0;
                const timer = setInterval(() => {
                    attempts++;
                    if (window.supabaseClient) {
                        clearInterval(timer);
                        loadInitialData();
                    } else if (attempts >= 50) {
                        clearInterval(timer);
                        window.showToast("Không thể tải cơ sở dữ liệu. Vui lòng F5 lại.", true);
                    }
                }, 100);
            }
            startApp();
        });
    </script>
</body>
</html>
