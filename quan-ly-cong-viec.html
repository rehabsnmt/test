<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="Quản lý công việc Bộ môn Phục hồi chức năng.">

    <meta http-equiv="Content-Security-Policy" content="
            default-src 'self';
            connect-src 'self' https://*.supabase.co;
            img-src 'self' data: https://*.supabase.co;
            style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.googleapis.com;
            script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
            font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com;
        ">

    <title>Quản lý công việc - Bộ môn Phục hồi chức năng</title>
    
    <link rel="icon" href="images/logo_Bộ môn.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tích hợp Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        .app-container { max-width: 1400px; margin: 0 auto; padding: 24px 0; background: transparent; }

        .page-header { 
            display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px; 
            position: static !important; 
            z-index: 1 !important; 
        }
        .page-title { margin: 0; font-size: 28px; font-weight: 700; }
        .page-subtitle { margin: 6px 0 0; color: var(--text-muted); font-size: 14px; }

        /* Nút bấm */
        .btn-custom {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            border: none; background: #e2e8f0; color: #334155;
            border-radius: 8px; padding: 9px 14px; font-weight: 600; cursor: pointer;
            font-size: 0.85rem; transition: 0.2s;
        }
        .btn-custom:hover { background: #cbd5e1; }

        .btn-custom-primary { background: var(--primary); color: white; }
        .btn-custom-primary:hover { background: var(--primary-hover); }

        .btn-custom-danger { background: #ef4444; color: white; }
        .btn-custom-danger:hover { background: #dc2626; }

        .btn-custom-success { background: #10b981; color: white; }
        .btn-custom-success:hover { background: #059669; }

        .btn-custom-warning { background: #f59e0b; color: white; }
        .btn-custom-warning:hover { background: #d97706; }

        .btn-custom-small { padding: 6px 12px; font-size: 0.8rem; }

        /* Dashboard tương tác - 3 thẻ thu gọn */
        .interactive-dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .dashboard-card { 
            background: white; border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; 
            display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.2s; user-select: none;
        }
        .dashboard-card:hover { border-color: var(--primary); }
        .dashboard-card.active { border: 2px solid var(--primary); background: var(--primary-light); }
        .dashboard-card.active .db-icon { color: var(--primary); }
        
        .db-icon { font-size: 1.8rem; color: var(--text-muted); transition: 0.2s; }
        .db-info { display: flex; flex-direction: column; }
        .db-title { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
        .db-value { font-size: 1.5rem; font-weight: 800; color: var(--text-dark); line-height: 1.2; }
        
        /* Container Biểu đồ Grid */
        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .chart-wrapper {
            background: white; border: 1px solid var(--border); border-radius: 12px; padding: 24px;
        }
        .chart-container {
            position: relative; height: 320px; width: 100%;
        }

        .search-bar-container { position: relative; margin-bottom: 20px; display: flex; gap: 10px;}
        .search-bar-wrapper { position: relative; flex: 1;}
        .search-bar-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-bar-wrapper input { padding-left: 42px; }

        .custom-input, .custom-select, .custom-textarea {
            width: 100%; border: 1px solid var(--border); border-radius: 8px;
            background: white; padding: 10px 12px; outline: none; font-family: inherit;
            font-size: 0.95rem; color: var(--text-dark);
        }
        .custom-input:focus, .custom-select:focus, .custom-textarea:focus {
            border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
        }

        .status-section-title {
            font-size: 1.15rem; font-weight: 700; margin: 10px 0 15px 0; padding-bottom: 8px;
            display: flex; align-items: center; gap: 8px;
            color: var(--text-dark); border-bottom: 2px solid var(--border);
        }

        /* Thẻ Kế hoạch gọn gàng */
        .plan-list { display: grid; gap: 14px; }
        .plan-card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 16px; transition: border-color .15s ease; }
        .plan-card:hover { border-color: var(--primary-light); }

        .plan-top { display: flex; justify-content: space-between; gap: 15px; align-items: flex-start; }
        .plan-main { min-width: 0; flex: 1; text-align: left; }
        .plan-title { margin: 0 0 6px; font-size: 1.05rem; font-weight: 700; color: var(--text-dark); line-height: 1.3; word-break: break-word; }

        .plan-meta { display: flex; gap: 12px; flex-wrap: wrap; color: var(--text-muted); font-size: 0.85rem; align-items: center; margin-top: 8px; }
        .plan-meta span { display: inline-flex; align-items: center; gap: 5px; }

        .plan-progress { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; width: 100px; flex-shrink: 0; }
        .progress-header { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); }
        .progress-track { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; width: 100%; margin: 0;}
        .progress-bar { height: 100%; background: var(--primary); border-radius: 99px; transition: width 0.3s ease; }

        .plan-bottom { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border-light); flex-wrap: wrap;}
        .plan-actions { flex-shrink: 0; }

        /* Cảnh báo đếm ngược nổi bật (Pulse Animation) */
        @keyframes pulse-critical {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.6); }
            70% { box-shadow: 0 0 0 8px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
        @keyframes pulse-high {
            0% { box-shadow: 0 0 0 0 rgba(234, 88, 12, 0.6); }
            70% { box-shadow: 0 0 0 8px rgba(234, 88, 12, 0); }
            100% { box-shadow: 0 0 0 0 rgba(234, 88, 12, 0); }
        }
        
        .status-badge {
            display: inline-flex; align-items: center; justify-content: center; gap: 5px;
            border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600; white-space: nowrap;
        }

        .badge-warning-critical { background: #dc2626; color: white; border: none; animation: pulse-critical 1.5s infinite; font-weight: 700; letter-spacing: 0.3px;}
        .badge-warning-high { background: #ea580c; color: white; border: none; animation: pulse-high 1.5s infinite; font-weight: 700; letter-spacing: 0.3px;}
        .badge-warning-medium { background: #f59e0b; color: white; border: none; }
        .badge-warning-low { background: #3b82f6; color: white; border: none; }
        .badge-gray { background: var(--bg-page); color: var(--text-body); border: 1px solid var(--border); }
        .badge-blue { background: #e0f2fe; color: #0284c7; }
        .badge-green { background: #dcfce7; color: #15803d; }

        /* Modals */
        .custom-modal-backdrop {
            position: fixed; inset: 0; background: rgba(15, 23, 42, .6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center; padding: 20px; z-index: 2000;
        }
        .custom-modal-backdrop.show { display: flex; }

        .custom-modal { width: min(720px, 100%); max-height: calc(100vh - 40px); overflow: auto; background: white; border-radius: 14px; box-shadow: 0 20px 60px rgba(0, 0, 0, .2); }
        
        .modal-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; background: #fff; color: var(--text-dark); }
        .modal-title { margin: 0; font-size: 19px; }
        .modal-close { border: 0; background: transparent; font-size: 24px; color: var(--text-muted); cursor: pointer; transition: 0.2s; }
        .modal-close:hover { color: var(--text-dark); }
        .modal-body { padding: 20px; text-align: left; }
        .modal-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-label { font-size: 13px; font-weight: 600; color: var(--text-dark); }

        .empty { padding: 50px 20px; text-align: center; color: var(--text-muted); background: white; border: 1px dashed var(--border); border-radius: 12px; }
        .loading { padding: 30px; text-align: center; color: var(--text-muted); font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .error-msg { padding: 12px 14px; margin-bottom: 15px; background: #fee2e2; color: #991b1b; border-radius: 8px; display: none; font-size: 0.9rem; }

        @media (max-width: 768px) {
            .app-container { padding: 10px; }
            .page-header { align-items: flex-start; flex-direction: column; }
            .page-title { font-size: 22px; }
            
            .plan-top { flex-direction: row; gap: 10px; }
            .plan-meta { flex-direction: column; align-items: flex-start; gap: 5px; }
            .plan-progress { width: 75px; }
            
            .plan-bottom { flex-direction: row; justify-content: space-between; align-items: center; }
            .plan-actions .btn-custom { padding: 6px 12px; font-size: 0.8rem; white-space: nowrap; }
            
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: auto; }
            .search-bar-container { flex-direction: column; }
            
            .charts-grid { grid-template-columns: 1fr; }
            .chart-wrapper { padding: 16px; }
            .chart-container { height: 280px; }
            
            /* Responsive Siêu thu gọn cho Dashboard Mobile */
            .interactive-dashboard { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .dashboard-card { flex-direction: column; text-align: center; padding: 10px 4px; gap: 4px; justify-content: center; }
            .db-icon { font-size: 1.3rem; }
            .db-info { align-items: center; }
            .db-title { font-size: 0.65rem; line-height: 1.2; letter-spacing: 0; word-break: break-word;}
            .db-value { font-size: 1.1rem; }
            
            .modal-footer { flex-direction: column-reverse; gap: 10px; align-items: stretch; }
            .modal-footer > div { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <main style="opacity: 0; transition: opacity 0.3s ease;">
        <div class="app-container">

            <header class="page-header">
                <div>
                    <h1 class="page-title">Quản lý công việc</h1>
                    <p id="page-subtitle" class="page-subtitle">Đang tải...</p>
                </div>
                <button id="btn-create-plan" class="btn-custom btn-custom-primary" style="display: none;">
                    <i class="fas fa-plus"></i> Tạo kế hoạch
                </button>
            </header>

            <div id="error-box" class="error-msg"></div>

            <!-- DASHBOARD TRỰC QUAN -->
            <div class="interactive-dashboard" id="main-dashboard" style="display: none;">
                <div class="dashboard-card active" data-filter="dang-thuc-hien" onclick="setDashboardFilter('dang-thuc-hien')">
                    <div class="db-icon"><i class="fas fa-play-circle"></i></div>
                    <div class="db-info">
                        <div class="db-title">Đang thực hiện</div>
                        <div class="db-value" id="count-active">0</div>
                    </div>
                </div>
                <div class="dashboard-card" data-filter="tre-han" onclick="setDashboardFilter('tre-han')">
                    <div class="db-icon" style="color: #ef4444;"><i class="fas fa-exclamation-triangle"></i></div>
                    <div class="db-info">
                        <div class="db-title">Trễ hạn</div>
                        <div class="db-value" id="count-overdue" style="color: #ef4444;">0</div>
                    </div>
                </div>
                <div class="dashboard-card" data-filter="hoan-thanh" onclick="setDashboardFilter('hoan-thanh')">
                    <div class="db-icon"><i class="fas fa-check-circle"></i></div>
                    <div class="db-info">
                        <div class="db-title">Hoàn thành</div>
                        <div class="db-value" id="count-completed">0</div>
                    </div>
                </div>
            </div>

            <!-- BIỂU ĐỒ -->
            <div class="charts-grid" id="main-charts" style="display: none;">
                <div class="chart-wrapper" style="margin-bottom: 0;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
                        <h3 style="margin: 0; font-size: 1.15rem; color: var(--text-dark); font-weight: 700;">
                            <i class="fas fa-chart-bar" style="color: var(--text-muted);"></i> Khối lượng công việc
                        </h3>
                        <select id="chart-status-filter" class="custom-select" style="max-width: 160px; font-size: 0.85rem; padding: 6px 10px; height: auto;" onchange="renderChart()">
                            <option value="active" selected>Đang thực hiện</option>
                            <option value="overdue">Trễ hạn</option>
                            <option value="completed">Đã hoàn thành</option>
                            <option value="all">Tất cả</option>
                        </select>
                    </div>
                    <div class="chart-container">
                        <canvas id="workloadChart"></canvas>
                    </div>
                </div>
                
                <div class="chart-wrapper" style="margin-bottom: 0;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
                        <h3 style="margin: 0; font-size: 1.15rem; color: var(--text-dark); font-weight: 700;">
                            <i class="fas fa-chart-line" style="color: var(--text-muted);"></i> Tốc độ hoàn thành (% theo tháng)
                        </h3>
                    </div>
                    <div class="chart-container">
                        <canvas id="completionTrendChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="search-bar-container">
                <div class="search-bar-wrapper">
                    <i class="fas fa-search"></i>
                    <input id="search-input" class="custom-input" type="search" placeholder="Tìm kiếm tên kế hoạch, mô tả...">
                </div>
                <select id="manager-filter" class="custom-select" style="max-width: 250px;">
                    <option value="">Lọc theo người phụ trách</option>
                </select>
            </div>

            <div id="plan-list-container">
                <div class="loading"><i class="fas fa-spinner fa-spin"></i> Đang tải dữ liệu...</div>
            </div>

        </div>
    </main>

    <div id="footer-placeholder"></div>

    <!-- MODALS -->
    <div id="plan-modal" class="custom-modal-backdrop">
        <div class="custom-modal">
            <div class="modal-header">
                <h2 id="plan-modal-title" class="modal-title">Tạo kế hoạch</h2>
                <button class="modal-close" onclick="closeModal('plan-modal')">×</button>
            </div>
            <form id="plan-form">
                <div class="modal-body">
                    <input id="plan-id" type="hidden">
                    <div class="form-grid">
                        <div class="form-group full">
                            <label class="form-label">Tên kế hoạch <span style="color:var(--accent)">*</span></label>
                            <input id="plan-name" class="custom-input" required>
                        </div>
                        <div class="form-group full">
                            <label class="form-label">Mô tả</label>
                            <textarea id="plan-description" class="custom-textarea" rows="4"></textarea>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Ngày bắt đầu <span style="color:var(--accent)">*</span></label>
                            <input id="plan-start" class="custom-input" type="date" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Ngày kết thúc <span style="color:var(--accent)">*</span></label>
                            <input id="plan-end" class="custom-input" type="date" required>
                        </div>
                        <div class="form-group full">
                            <label class="form-label">Người phụ trách <span style="color:var(--accent)">*</span></label>
                            <select id="plan-manager" class="custom-select" required>
                                <option value="">-- Chọn người phụ trách --</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <div id="plan-modal-extra-actions" style="display: none; gap: 8px; flex: 1;">
                        <button type="button" class="btn-custom btn-custom-danger" id="btnDeletePlanModal" onclick="handleDeleteFromModal()">
                            <i class="fas fa-trash-alt"></i> Xóa
                        </button>
                    </div>
                    <div style="display: flex; gap: 8px; margin-left: auto;">
                        <button type="button" class="btn-custom" onclick="closeModal('plan-modal')">Hủy</button>
                        <button type="submit" class="btn-custom btn-custom-primary" id="btnSavePlan"><i class="fas fa-save"></i> Lưu kế hoạch</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div id="delete-plan-modal" class="custom-modal-backdrop">
        <div class="custom-modal" style="max-width: 450px;">
            <div class="modal-header">
                <h2 class="modal-title" style="color:var(--accent)"><i class="fas fa-exclamation-triangle"></i> Xóa Kế hoạch</h2>
                <button class="modal-close" onclick="closeModal('delete-plan-modal')">×</button>
            </div>
            <form id="delete-plan-form" onsubmit="submitDeletePlan(event)">
                <div class="modal-body">
                    <p style="margin-bottom: 10px; line-height: 1.5; color: var(--text-dark);">Hành động này sẽ xóa vĩnh viễn kế hoạch và toàn bộ công việc đi kèm. Vui lòng nhập mã số <strong id="delete-random-code" style="color:var(--accent); font-size:1.15rem;"></strong> để xác nhận.</p>
                    <input id="delete-confirm-input" class="custom-input" type="text" autocomplete="off" placeholder="Nhập mã xác nhận..." required>
                </div>
                <div class="modal-footer" style="justify-content: flex-end;">
                    <button type="button" class="btn-custom" onclick="closeModal('delete-plan-modal')">Hủy</button>
                    <button type="submit" class="btn-custom btn-custom-danger" id="btnConfirmDeletePlan"><i class="fas fa-trash-alt"></i> Xóa Vĩnh Viễn</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/layout.js"></script>

    <script>
        // QUẢN LÝ TRẠNG THÁI TOÀN CỤC
        let currentUser = null;
        let currentAccount = null;
        let plans = [];
        let allAssignments = [];
        let allTasksData = [];
        let allEvidences = [];
        let lecturers = [];
        
        let workloadChartInstance = null;
        let completionChartInstance = null;

        let currentPlanId = null; 
        let planToDeleteId = null;
        let deleteRandomCode = "";

        let activeFilter = 'dang-thuc-hien'; 

        document.addEventListener("DOMContentLoaded", () => {
            let attempts = 0;
            const timer = setInterval(() => {
                attempts++;
                if (window.supabaseClient) {
                    clearInterval(timer);
                    initApp();
                } else if (attempts >= 50) {
                    clearInterval(timer);
                    showError("Lỗi kết nối cơ sở dữ liệu (Supabase Client chưa sẵn sàng).");
                }
            }, 100);
        });

        async function initApp() {
            try {
                await loadCurrentUser();
                await loadLecturers();
                await loadPlans();
                setupEvents();
            } catch (error) {
                showError(error.message);
                document.getElementById('plan-list-container').innerHTML = `<div class="empty text-danger">Bạn không có quyền truy cập hoặc lỗi kết nối.</div>`;
            }
        }

        async function loadCurrentUser() {
            const { data, error } = await window.supabaseClient.auth.getUser();
            if (error || !data.user) throw new Error("Chưa đăng nhập hệ thống.");
            currentUser = data.user;

            const { data: account, error: accountError } = await window.supabaseClient
                .from("tai-khoan-he-thong")
                .select(`id, role, "ma-giang-vien", "ho-ten", "trang-thai"`)
                .eq("id", currentUser.id)
                .single();

            if (accountError || !account) throw new Error("Không tìm thấy thông tin quyền trên hệ thống.");
            if (!account["trang-thai"]) throw new Error("Tài khoản hiện không hoạt động.");

            currentAccount = account;
            applyRoleUI();
        }

        function isAdmin() { return ["superadmin", "head", "admin"].includes(currentAccount?.role); }
        function isApprover() { return ["superadmin", "head"].includes(currentAccount?.role); }

        function applyRoleUI() {
            const btn = document.getElementById("btn-create-plan");
            const subtitle = document.getElementById("page-subtitle");

            if (isApprover()) {
                if (btn) btn.style.display = "inline-flex";
                if (subtitle) subtitle.innerText = "Quản lý kế hoạch và điều phối phân công nội bộ.";
            } else {
                if (btn) btn.style.display = "none";
                if (subtitle) subtitle.innerText = "Quản lý kế hoạch và công việc cá nhân.";
            }
            
            const dash = document.getElementById("main-dashboard");
            const chartsGrid = document.getElementById("main-charts");
            
            if (isApprover()) {
                if (dash) dash.style.display = "grid";
                if (chartsGrid) chartsGrid.style.display = "grid";
            } else {
                if (dash) dash.style.display = "none";
                if (chartsGrid) chartsGrid.style.display = "none";
            }
        }

        async function loadLecturers() {
            try {
                const { data, error } = await window.supabaseClient.from("giang-vien").select(`"ma-giang-vien", "ho-ten"`).order("ho-ten");
                if (error) throw error;
                lecturers = data || [];

                const select = document.getElementById("plan-manager");
                const filterSelect = document.getElementById("manager-filter");
                
                select.innerHTML = `<option value="">-- Chọn người phụ trách --</option>`;
                filterSelect.innerHTML = `<option value="">Lọc theo người phụ trách</option>`;
                
                lecturers.forEach(gv => {
                    const name = gv["ho-ten"] ? gv["ho-ten"] : gv["ma-giang-vien"];
                    select.appendChild(new Option(name, gv["ma-giang-vien"]));
                    filterSelect.appendChild(new Option(name, gv["ma-giang-vien"]));
                });
            } catch (err) {
                console.warn("Lỗi loadLecturers: ", err);
            }
        }

        async function loadPlans() {
            try {
                const [planRes, assignRes, taskRes, evRes] = await Promise.all([
                    window.supabaseClient.from("ke-hoach").select("*"), // SCHEMA MỚI
                    window.supabaseClient.from("nhan-su-cong-viec").select("cong-viec-id, ma-giang-vien"),
                    window.supabaseClient.from("cong-viec").select("id, trang-thai, ke-hoach-id, han-hoan-thanh"),
                    window.supabaseClient.from("cong-viec-minh-chung").select("cong-viec-id, ma-giang-vien")
                ]);

                if (planRes.error) throw planRes.error;
                if (assignRes.error) throw assignRes.error;
                if (taskRes.error) throw taskRes.error;
                if (evRes.error) throw evRes.error;

                let allPlans = planRes.data || [];
                allAssignments = assignRes.data || [];
                allTasksData = taskRes.data || [];
                allEvidences = evRes.data || [];

                // LỌC KẾ HOẠCH DÀNH CHO ADMIN VÀ GIẢNG VIÊN THÔNG THƯỜNG
                if (!isApprover()) {
                    const myMaGV = currentAccount["ma-giang-vien"];
                    const myTaskIds = allAssignments.filter(a => a["ma-giang-vien"] === myMaGV).map(a => a["cong-viec-id"]);
                    const myPlanIds = allTasksData.filter(t => myTaskIds.includes(t.id)).map(t => t["ke-hoach-id"]);
                    
                    allPlans = allPlans.filter(p => 
                        p["created-by-ma-gv"] === myMaGV || 
                        p["nguoi-phu-trach-ma-gv"] === myMaGV || 
                        myPlanIds.includes(p.id)
                    );
                }

                // TÍNH TOÁN TIẾN ĐỘ VÀ TRẠNG THÁI
                allPlans.forEach(p => {
                    const pTasks = allTasksData.filter(t => t["ke-hoach-id"] === p.id);
                    const tTotal = pTasks.length;
                    const tComp = pTasks.filter(t => t["trang-thai"] === "hoan-thanh").length;
                    p["tien-do"] = tTotal > 0 ? (tComp / tTotal) * 100 : 0;
                });

                plans = allPlans;

                // Gắn trạng thái công việc vào từng phân công để vẽ biểu đồ
                allAssignments.forEach(a => {
                    const task = allTasksData.find(t => t.id === a["cong-viec-id"]);
                    a["trang-thai"] = task ? task["trang-thai"] : "dang-thuc-hien";
                    a["han-hoan-thanh"] = task ? task["han-hoan-thanh"] : null;
                });

                if (isApprover()) {
                    updateDashboardCounts();
                    renderChart();
                    renderTrendChart();
                }
                
                renderPlans();
            } catch (err) {
                console.error(err);
                throw new Error("Lỗi khi tải dữ liệu hệ thống.");
            }
        }

        function renderChart() {
            const ctx = document.getElementById('workloadChart');
            if (!ctx) return;

            const filterSelect = document.getElementById('chart-status-filter');
            const filterVal = filterSelect ? filterSelect.value : 'active';
            
            const today = new Date();
            today.setHours(0,0,0,0);

            const labels = [];
            const planData = [];
            const taskData = [];

            lecturers.forEach(gv => {
                const maGV = gv["ma-giang-vien"];
                const name = gv["ho-ten"] || maGV;
                
                let pCount = 0;
                let tCount = 0;

                const gvPlans = plans.filter(p => p["nguoi-phu-trach-ma-gv"] === maGV);
                const gvTasks = allAssignments.filter(a => a["ma-giang-vien"] === maGV);

                if (filterVal === 'all') {
                    pCount = gvPlans.length;
                    tCount = gvTasks.length;
                } else if (filterVal === 'completed') {
                    pCount = gvPlans.filter(p => p["trang-thai"] === "hoan-thanh").length;
                    tCount = gvTasks.filter(a => a["trang-thai"] === "hoan-thanh").length;
                } else if (filterVal === 'active') {
                    pCount = gvPlans.filter(p => p["trang-thai"] !== "hoan-thanh").length;
                    tCount = gvTasks.filter(a => a["trang-thai"] !== "hoan-thanh").length;
                } else if (filterVal === 'overdue') {
                    pCount = gvPlans.filter(p => {
                        if (p["trang-thai"] === "hoan-thanh" || !p["ngay-ket-thuc"]) return false;
                        const d = new Date(p["ngay-ket-thuc"]); d.setHours(0,0,0,0);
                        return d < today;
                    }).length;
                    tCount = gvTasks.filter(a => {
                        if (a["trang-thai"] === "hoan-thanh" || !a["han-hoan-thanh"]) return false;
                        const d = new Date(a["han-hoan-thanh"]); d.setHours(0,0,0,0);
                        return d < today;
                    }).length;
                }

                if (pCount > 0 || tCount > 0) {
                    labels.push(name); 
                    planData.push(pCount);
                    taskData.push(tCount);
                }
            });

            if (workloadChartInstance) {
                workloadChartInstance.destroy();
            }

            Chart.defaults.font.family = "'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
            Chart.defaults.color = '#64748b';

            workloadChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Kế hoạch phụ trách',
                            data: planData,
                            backgroundColor: '#0284c7', 
                            borderRadius: 4
                        },
                        {
                            label: 'Công việc tham gia',
                            data: taskData,
                            backgroundColor: '#94a3b8', 
                            borderRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { stacked: true, grid: { display: false } },
                        y: { stacked: true, beginAtZero: true, ticks: { stepSize: 1 } }
                    },
                    plugins: {
                        legend: { position: 'top', labels: { usePointStyle: true, boxWidth: 8 } },
                        tooltip: { mode: 'index', intersect: false }
                    }
                }
            });
        }

        function renderTrendChart() {
            const ctx = document.getElementById('completionTrendChart');
            if (!ctx) return;

            const labels = [];
            const dataRates = [];

            const today = new Date();
            for (let i = 5; i >= 0; i--) {
                const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
                const monthStr = `${d.getMonth() + 1}/${d.getFullYear()}`;
                labels.push(monthStr);

                const monthTasks = allTasksData.filter(t => {
                    if (!t["han-hoan-thanh"]) return false;
                    const td = new Date(t["han-hoan-thanh"]);
                    return td.getMonth() === d.getMonth() && td.getFullYear() === d.getFullYear();
                });

                if (monthTasks.length === 0) {
                    dataRates.push(0);
                } else {
                    const completed = monthTasks.filter(t => t["trang-thai"] === "hoan-thanh").length;
                    const rate = Math.round((completed / monthTasks.length) * 100);
                    dataRates.push(rate);
                }
            }

            if (completionChartInstance) {
                completionChartInstance.destroy();
            }

            completionChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '% Tỷ lệ Hoàn thành',
                        data: dataRates,
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.15)',
                        fill: true,
                        tension: 0.3,
                        pointBackgroundColor: '#10b981',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: { callback: function(value) { return value + '%' } }
                        },
                        x: { grid: { display: false } }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) { return context.parsed.y + '%'; }
                            }
                        }
                    }
                }
            });
        }

        function setDashboardFilter(type) {
            activeFilter = type;
            document.querySelectorAll('.dashboard-card').forEach(c => c.classList.remove('active'));
            document.querySelector(`.dashboard-card[data-filter="${type}"]`).classList.add('active');
            renderPlans();
        }

        function updateDashboardCounts() {
            const today = new Date();
            today.setHours(0,0,0,0);

            document.getElementById('count-active').textContent = plans.filter(p => p["trang-thai"] !== "hoan-thanh").length;
            document.getElementById('count-completed').textContent = plans.filter(p => p["trang-thai"] === "hoan-thanh").length;
            
            document.getElementById('count-overdue').textContent = plans.filter(p => {
                if (p["trang-thai"] === "hoan-thanh" || !p["ngay-ket-thuc"]) return false;
                const end = new Date(p["ngay-ket-thuc"]);
                end.setHours(0,0,0,0);
                return end < today;
            }).length;
        }

        function getDeadlineWarning(dateStr, status) {
            if (!dateStr || status === 'hoan-thanh') return "";
            try {
                const today = new Date();
                today.setHours(0,0,0,0);
                const target = new Date(dateStr);
                if (isNaN(target)) return "";
                target.setHours(0,0,0,0);
                
                const diffTime = target - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays < 0) return `<span class="status-badge badge-warning-critical"><i class="fas fa-exclamation-triangle"></i> Quá hạn ${Math.abs(diffDays)} ngày</span>`;
                if (diffDays === 0) return `<span class="status-badge badge-warning-critical"><i class="fas fa-exclamation-circle"></i> Hết hạn hôm nay!</span>`;
                if (diffDays <= 1) return `<span class="status-badge badge-warning-critical"><i class="fas fa-exclamation-circle"></i> Còn 1 ngày!</span>`;
                if (diffDays <= 3) return `<span class="status-badge badge-warning-high"><i class="fas fa-exclamation-circle"></i> Còn ${diffDays} ngày</span>`;
                if (diffDays <= 7) return `<span class="status-badge badge-warning-medium"><i class="far fa-clock"></i> Còn ${diffDays} ngày</span>`;
                if (diffDays <= 10) return `<span class="status-badge badge-warning-low"><i class="far fa-clock"></i> Còn ${diffDays} ngày</span>`;
            } catch (e) { return ""; }
            return "";
        }

        function renderPlans() {
            const container = document.getElementById("plan-list-container");
            const keyword = document.getElementById("search-input").value.trim().toLowerCase();
            const managerFilter = document.getElementById("manager-filter").value;

            const today = new Date();
            today.setHours(0,0,0,0);

            let filtered = plans.filter(plan => {
                const matchKeyword = !keyword || String(plan.ten || "").toLowerCase().includes(keyword) || String(plan["mo-ta"] || "").toLowerCase().includes(keyword);
                const matchManager = !managerFilter || plan["nguoi-phu-trach-ma-gv"] === managerFilter;
                
                let matchType = true;
                if (isApprover()) {
                    if (activeFilter === 'dang-thuc-hien') {
                        matchType = plan["trang-thai"] !== "hoan-thanh";
                    }
                    if (activeFilter === 'hoan-thanh') {
                        matchType = plan["trang-thai"] === "hoan-thanh";
                    }
                    if (activeFilter === 'tre-han') {
                        if (plan["trang-thai"] === "hoan-thanh" || !plan["ngay-ket-thuc"]) {
                            matchType = false;
                        } else {
                            const end = new Date(plan["ngay-ket-thuc"]);
                            end.setHours(0,0,0,0);
                            matchType = end < today;
                        }
                    }
                }
                
                return matchKeyword && matchManager && matchType;
            });

            if (!filtered.length) {
                container.innerHTML = `<div class="empty">Không có kế hoạch phù hợp với bộ lọc hiện tại.</div>`;
                return;
            }

            filtered.sort((a, b) => {
                if (!a["ngay-ket-thuc"]) return 1;
                if (!b["ngay-ket-thuc"]) return -1;
                return new Date(a["ngay-ket-thuc"]) - new Date(b["ngay-ket-thuc"]);
            });

            const activePlans = filtered.filter(p => p["trang-thai"] !== "hoan-thanh");
            const completedPlans = filtered.filter(p => p["trang-thai"] === "hoan-thanh");
            
            const overduePlans = activePlans.filter(p => {
                if (!p["ngay-ket-thuc"]) return false;
                const end = new Date(p["ngay-ket-thuc"]);
                end.setHours(0,0,0,0);
                return end < today;
            });

            let htmlStr = "";
            
            if (!isApprover()) {
                const normalActivePlans = activePlans.filter(p => !overduePlans.includes(p));

                if (overduePlans.length > 0) {
                    htmlStr += `<h3 class="status-section-title pending" style="color: #dc2626; border-color: #fca5a5;"><i class="fas fa-exclamation-triangle"></i> Kế hoạch trễ hạn (${overduePlans.length})</h3>`;
                    htmlStr += `<div class="plan-list">` + overduePlans.map(renderPlanCard).join("") + `</div>`;
                }
                if (normalActivePlans.length > 0) {
                    htmlStr += `<h3 class="status-section-title approved" style="margin-top: 25px;"><i class="fas fa-play-circle"></i> Danh sách đang thực hiện (${normalActivePlans.length})</h3>`;
                    htmlStr += `<div class="plan-list">` + normalActivePlans.map(renderPlanCard).join("") + `</div>`;
                }
                if (completedPlans.length > 0) {
                    htmlStr += `<h3 class="status-section-title completed" style="margin-top: 25px;"><i class="fas fa-check-circle"></i> Danh sách hoàn thành (${completedPlans.length})</h3>`;
                    htmlStr += `<div class="plan-list">` + completedPlans.map(renderPlanCard).join("") + `</div>`;
                }
            } else {
                if (activeFilter === 'tre-han' && filtered.length > 0) {
                    htmlStr += `<h3 class="status-section-title pending" style="color: #dc2626; border-color: #fca5a5;"><i class="fas fa-exclamation-triangle"></i> Danh sách trễ hạn (${filtered.length})</h3>`;
                    htmlStr += `<div class="plan-list">` + filtered.map(renderPlanCard).join("") + `</div>`;
                }
                else if (activeFilter === 'dang-thuc-hien' && activePlans.length > 0) {
                    htmlStr += `<h3 class="status-section-title approved"><i class="fas fa-play-circle"></i> Danh sách đang thực hiện (${activePlans.length})</h3>`;
                    htmlStr += `<div class="plan-list">` + activePlans.map(renderPlanCard).join("") + `</div>`;
                }
                else if (activeFilter === 'hoan-thanh' && completedPlans.length > 0) {
                    htmlStr += `<h3 class="status-section-title completed"><i class="fas fa-check-circle"></i> Danh sách hoàn thành (${completedPlans.length})</h3>`;
                    htmlStr += `<div class="plan-list">` + completedPlans.map(renderPlanCard).join("") + `</div>`;
                }
            }

            container.innerHTML = htmlStr;
        }

        function renderPlanCard(plan) {
            const progress = Number(plan["tien-do"] || 0);
            const manager = findLecturer(plan["nguoi-phu-trach-ma-gv"]);
            const warningBadge = getDeadlineWarning(plan["ngay-ket-thuc"], plan["trang-thai"]);

            let personalCounterHtml = "";
            if (currentAccount) {
                const myMaGV = currentAccount["ma-giang-vien"];
                const planTasks = allTasksData.filter(t => t["ke-hoach-id"] === plan.id);
                const planTaskIds = planTasks.map(t => t.id);
                
                const myAssignments = allAssignments.filter(a => a["ma-giang-vien"] === myMaGV && planTaskIds.includes(a["cong-viec-id"]));
                const totalAssigned = myAssignments.length;
                
                if (totalAssigned > 0) {
                    let completedAssigned = 0;
                    myAssignments.forEach(a => {
                        const hasSubmitted = allEvidences.some(e => e["cong-viec-id"] === a["cong-viec-id"] && e["ma-giang-vien"] === myMaGV);
                        if (hasSubmitted) completedAssigned++;
                    });
                    
                    const badgeClass = completedAssigned === totalAssigned ? "badge-green" : "badge-blue";
                    personalCounterHtml = `<div class="status-badge ${badgeClass}" style="font-size: 0.8rem; padding: 4px 10px; font-weight: 600;"><i class="fas fa-clipboard-list"></i> Cá nhân đã hoàn thành: ${completedAssigned}/${totalAssigned}</div>`;
                }
            }

            return `
                <div class="plan-card" id="plan-card-${plan.id}">
                    <div class="plan-top">
                        <div class="plan-main">
                            <h3 class="plan-title">${escapeHtml(plan.ten)}</h3>
                            <div class="plan-meta">
                                <span><i class="far fa-calendar-alt"></i> Hạn: ${formatDate(plan["ngay-ket-thuc"])}</span>
                                ${warningBadge}
                                <span><i class="fas fa-user-tie"></i> Phụ trách: ${escapeHtml(manager?.["ho-ten"] || "Chưa phân công")}</span>
                            </div>
                        </div>

                        <div class="plan-progress">
                            <div class="progress-header">
                                <span>${formatProgress(progress)}</span>
                            </div>
                            <div class="progress-track">
                                <div class="progress-bar" style="width:${Math.min(100, Math.max(0, progress))}%;"></div>
                            </div>
                        </div>
                    </div>

                    <div class="plan-bottom">
                        ${personalCounterHtml ? `<div style="margin-right: auto;">${personalCounterHtml}</div>` : ''}
                        <div class="plan-actions" ${personalCounterHtml ? '' : 'style="margin-left: auto;"'}>
                            <button class="btn-custom btn-custom-small btn-custom-primary" onclick="window.location.href='chi-tiet-ke-hoach.html?id=${plan.id}'">
                                Chi tiết <i class="fas fa-chevron-right" style="margin-left:3px; font-size:10px;"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        /* =========================================================
           CREATE/EDIT/SAVE PLAN MODAL
        ========================================================= */
        document.getElementById("btn-create-plan").addEventListener("click", () => {
            currentPlanId = null;
            document.getElementById("plan-form").reset();
            document.getElementById("plan-id").value = "";
            document.getElementById("plan-modal-title").innerHTML = 'Tạo kế hoạch';
            document.getElementById("plan-modal-extra-actions").style.display = "none";
            openModal("plan-modal");
        });

        document.getElementById("plan-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            const id = document.getElementById("plan-id").value;
            const payload = {
                "ten": document.getElementById("plan-name").value.trim(),
                "mo-ta": document.getElementById("plan-description").value.trim() || null,
                "ngay-bat-dau": document.getElementById("plan-start").value,
                "ngay-ket-thuc": document.getElementById("plan-end").value,
                "nguoi-phu-trach-ma-gv": document.getElementById("plan-manager").value || null
            };

            try {
                const btn = document.getElementById("btnSavePlan");
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang lưu...';
                btn.disabled = true;

                if (id) {
                    const { error } = await window.supabaseClient.from("ke-hoach").update(payload).eq("id", id);
                    if (error) throw error;
                } else {
                    payload["created-by-ma-gv"] = currentAccount["ma-giang-vien"];
                    payload["trang-thai"] = "dang-thuc-hien"; 
                    const { error } = await window.supabaseClient.from("ke-hoach").insert(payload);
                    if (error) throw error;
                }
                
                closeModal("plan-modal");
                await loadPlans();

                btn.innerHTML = '<i class="fas fa-save"></i> Lưu kế hoạch';
                btn.disabled = false;
            } catch (error) { 
                showError(error.message); 
                document.getElementById("btnSavePlan").disabled = false;
                document.getElementById("btnSavePlan").innerHTML = '<i class="fas fa-save"></i> Lưu kế hoạch';
            }
        });

        function handleDeleteFromModal() {
            if(!currentPlanId) return;
            closeModal('plan-modal');
            openDeletePlanModal(currentPlanId);
        }

        /* =========================================================
           XOÁ KẾ HOẠCH BẰNG MÃ XÁC NHẬN
        ========================================================= */
        function openDeletePlanModal(planId) {
            planToDeleteId = planId;
            deleteRandomCode = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById("delete-random-code").textContent = deleteRandomCode;
            document.getElementById("delete-confirm-input").value = "";
            openModal("delete-plan-modal");
        }

        async function submitDeletePlan(event) {
            event.preventDefault();
            const inputVal = document.getElementById("delete-confirm-input").value.trim();
            if (inputVal !== deleteRandomCode) {
                alert("Mã xác nhận không khớp. Vui lòng nhập đúng dãy số màu đỏ.");
                return;
            }
            try {
                const btn = document.getElementById("btnConfirmDeletePlan");
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Xóa...';
                btn.disabled = true;

                const { error } = await window.supabaseClient.from("ke-hoach").delete().eq("id", planToDeleteId);
                if (error) throw error;
                
                closeModal("delete-plan-modal");
                await loadPlans();

                btn.innerHTML = '<i class="fas fa-trash-alt"></i> Xóa Vĩnh Viễn';
                btn.disabled = false;
            } catch (error) { showError(error.message); }
        }

        function setupEvents() {
            document.getElementById("search-input").addEventListener("input", renderPlans);
            document.getElementById("manager-filter").addEventListener("change", renderPlans);
        }

        function openModal(id) { document.getElementById(id).classList.add("show"); }
        function closeModal(id) { document.getElementById(id).classList.remove("show"); }

        function findLecturer(maGV) {
            if (!maGV) return null;
            return lecturers.find(gv => gv["ma-giang-vien"] === maGV);
        }

        function formatDate(value) {
            if (!value) return "—";
            try {
                const parts = value.split("-");
                if (parts.length < 3) return value;
                return `${parts[2].substring(0,2)}/${parts[1]}/${parts[0]}`; 
            } catch(e) { return value; }
        }

        function formatProgress(value) {
            const number = Number(value || 0);
            if (Number.isInteger(number)) return `${number}%`;
            return `${number.toFixed(1)}%`;
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function showError(message) {
            const box = document.getElementById("error-box");
            box.innerHTML = `<i class="fas fa-exclamation-triangle"></i> <span>${message || "Có lỗi xảy ra."}</span>`;
            box.style.display = "block";
            setTimeout(() => { box.style.display = "none"; }, 5000);
        }

    </script>
