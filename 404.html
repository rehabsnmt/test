<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Trang không tồn tại hoặc đang phát triển.">
    <title>Đang phát triển - Bộ môn Phục hồi chức năng</title>
    
    <link rel="icon" href="images/logo_Bộ môn.png" type="image/png">
    <link rel="apple-touch-icon" href="images/logo_Bộ môn.png">
    
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        /* --- CSS CHO TRANG 404 TỐI GIẢN --- */
        body {
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
            background-color: var(--bg-page, #f8fafc);
            margin: 0;
        }

        main {
            width: 100%;
            padding: 2rem 5%;
            display: flex;
            justify-content: center;
        }

        .error-container {
            text-align: center;
            background: var(--surface, #ffffff);
            padding: 4rem 2rem;
            border-radius: var(--radius-md, 16px);
            box-shadow: var(--shadow-sm, 0 1px 2px rgba(2, 132, 199, 0.05));
            border: 1px solid var(--border, #e2e8f0);
            max-width: 500px;
            width: 100%;
        }

        .error-container h2 {
            font-size: 1.8rem;
            color: var(--text-dark, #0f172a);
            margin-bottom: 1rem;
        }

        .error-container p {
            font-size: 1.05rem;
            color: var(--text-body, #475569);
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 768px) {
            .error-container { padding: 3rem 1.5rem; }
            .error-container h2 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <main>
        <div class="error-container">
            <h2>Nội dung đang phát triển</h2>
            <p>Xin lỗi, trang bạn đang truy cập hiện chưa hoàn thiện hoặc đang trong quá trình cập nhật dữ liệu. Vui lòng quay lại sau!</p>
            <a href="index.html" class="btn-primary">Về trang chủ</a>
        </div>
    </main>
</body>
</html>
