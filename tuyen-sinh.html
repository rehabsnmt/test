    <style>
        .app-container { max-width: 1200px; margin: 0 auto; padding: 24px 16px; background: transparent; }

        /* Nút bấm hệ thống */
        .btn-custom {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            border: 1px solid var(--border); background: white; color: var(--text-dark);
            border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer;
            font-size: 0.9rem; transition: 0.2s; text-decoration: none;
        }
        .btn-custom:hover { background: var(--bg-page); }
        .btn-custom-primary { border-color: var(--primary); background: var(--primary); color: white; }
        .btn-custom-primary:hover { background: var(--primary-hover); color: white;}

        /* Card hiển thị chung */
        .plan-overview-card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .plan-title-large { font-size: 22px; font-weight: 700; color: var(--text-dark); margin: 0; }
        .plan-description { margin: 0; color: var(--text-muted); font-size: 15px; line-height: 1.6; }

        .meta-label { color: var(--text-muted); font-size: 13px; font-weight: 500; }
        .status-section-title { font-size: 1.15rem; font-weight: 700; margin: 10px 0 15px 0; padding-bottom: 8px; display: flex; align-items: center; gap: 8px; color: var(--text-dark); border-bottom: 2px solid var(--border-light); }

        /* Khung chương trình (Kế thừa từ Task List) */
        .task-list { display: grid; gap: 14px; }
        .task-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 0; text-align: left; transition: border-color 0.2s; overflow: hidden; }
        .task-card:hover { border-color: var(--primary-light); }
        .task-top { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; cursor: pointer; transition: background 0.2s; }
        .task-top:hover { background: var(--bg-page); }
        .task-title { font-weight: 700; margin: 0; color: var(--text-dark); font-size: 16px; }
        
        .status-badge {
            display: inline-flex; align-items: center; justify-content: center; gap: 5px;
            border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; white-space: nowrap;
        }
        .badge-gray { background: var(--bg-page); color: var(--text-body); border: 1px solid var(--border); }
        .badge-blue { background: #e0f2fe; color: #0284c7; }

        /* Chuyên ngành Tab Buttons */
        .major-tabs-container { display: flex; gap: 10px; margin-bottom: 24px; overflow-x: auto; scrollbar-width: none; }
        .major-tabs-container::-webkit-scrollbar { display: none; }
        .tab-btn { flex: 1; padding: 14px 10px; font-size: 14px; white-space: nowrap; text-align: center; border: 2px solid var(--border-light); background: white; color: var(--text-muted); border-radius: 10px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
        .tab-btn:hover { border-color: var(--border); color: var(--text-dark); background: var(--bg-page); }
        .tab-btn.active { border-color: var(--primary); background: var(--primary-light); color: var(--primary); box-shadow: 0 4px 12px rgba(2, 132, 199, 0.1); transform: scale(1.02); z-index: 1;}

        /* Bảng Khung chương trình */
        .curriculum-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; margin-top: 10px; }
        .curriculum-table th { padding: 12px 10px; font-weight: 600; color: var(--text-muted); border-bottom: 2px solid var(--border-light); white-space: nowrap; }
        .curriculum-table td { padding: 12px 10px; border-bottom: 1px solid var(--border-light); color: var(--text-dark); }
        .curriculum-table tr:last-child td { border-bottom: none; }
        .curriculum-table tr:hover td { background: var(--bg-page); }

        /* Layout Container Top Info */
        .top-info-layout { display: flex; gap: 24px; align-items: stretch; flex-wrap: wrap; }
        .top-info-left { flex: 1; min-width: 280px; display: flex; align-items: center; gap: 16px; justify-content: center; }
        .top-info-right { flex: 2; min-width: 300px; display: flex; flex-direction: column; gap: 10px; justify-content: center; border-left: 1px dashed var(--border); padding-left: 24px; }
        .top-info-action { width: 100%; display: flex; justify-content: center; margin-top: 15px; }

        @media (max-width: 900px) {
            .top-info-right { border-left: none; padding-left: 0; border-top: 1px dashed var(--border); padding-top: 20px; }
            .top-info-left { justify-content: flex-start; }
            .tab-btn { font-size: 13px; padding: 12px 8px; }
        }
    </style>

            // 2. HTML Danh sách việc làm

                <li style="display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; color: var(--text-dark); font-size: 15px; line-height: 1.5;">
                    <i class="fas fa-check-circle" style="color: var(--primary); margin-top: 4px; font-size: 14px;"></i>
                    <span>${job}</span>
                </li>
            `).join('');

            // 3. HTML Khung chương trình
            const semestersHtml = semesters.map(sem => {
                const subjects = curriculumDatabase[sem.key]?.filter(sub => !sub.tags || sub.tags.includes(activeMajor)) || [];
                const isOpen = expandedSemester === sem.id;
                const totalCredits = subjects.reduce((a, c) => a + c.theory + c.practice, 0);
                
                let tableHtml = '';
                if (isOpen) {
                    const rowsHtml = subjects.map((sub, idx) => `
                        <tr>
                            <td style="width: 50px;">${idx + 1}</td>
                            <td style="font-weight: 500; min-width: 200px;">${sub.name}</td>
                            <td style="text-align: center; white-space: nowrap;">
                                <span style="font-weight: 700;">${sub.theory + sub.practice}</span>
                                <span style="color: var(--text-muted); font-size: 12px; margin-left: 4px;">(${sub.theory}+${sub.practice})</span>
                            </td>
                        </tr>
                    `).join('');

                    tableHtml = `
                        <div style="padding: 0 20px 20px;">
                            <div style="overflow-x: auto;">
                                <table class="curriculum-table">
                                    <thead>
                                        <tr>
                                            <th>STT</th>
                                            <th>Tên học phần</th>
                                            <th style="text-align: center;">Tín chỉ (LT+TH)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${rowsHtml}
                                    </tbody>
                                </table>
                            </div>
                            <div style="margin-top: 15px; padding: 12px 16px; background: var(--bg-page); border-radius: 8px; border: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; font-size: 13px;">
                                <span style="color: var(--text-dark);"><i class="fas fa-info-circle" style="color: var(--primary); margin-right: 5px;"></i> Tổng: <b>${totalCredits}</b> tín chỉ</span>
                                <span style="color: var(--text-muted); font-style: italic;">*Khung chương trình 2025</span>
                            </div>
                        </div>
                    `;
                }

                return `
                    <div class="task-card">
                        <div class="task-top" onclick="toggleSemester(${sem.id})">
                            <div style="display: flex; gap: 15px; align-items: center;">
                                <div class="status-badge ${isOpen ? 'badge-blue' : 'badge-gray'}" style="width: 34px; height: 34px; padding: 0; border-radius: 50%; font-size: 14px;">${sem.id}</div>
                                <div class="task-title" style="color: ${isOpen ? 'var(--primary)' : 'var(--text-dark)'};">${sem.title}</div>
                            </div>
                            <i class="fas fa-chevron-right" style="color: var(--text-muted); transition: transform 0.2s; transform: ${isOpen ? 'rotate(90deg)' : 'rotate(0)'};"></i>
                        </div>
                        ${tableHtml}
                    </div>
                `;
            }).join('');

            // Gắn toàn bộ mã HTML vào Container
            container.innerHTML = `
                <!-- THÔNG TIN CHUNG (Trải rộng, Tổ hợp môn căn trái xếp dọc) -->
                <div class="plan-overview-card top-info-layout">
                  
                  <!-- Left: Icon + Tên Ngành -->
                  <div class="top-info-left">
                    <div style="background: var(--primary); color: white; width: 65px; height: 65px; border-radius: 14px; display: flex; justify-content: center; align-items: center; font-size: 30px; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); flex-shrink: 0;">
                      <i class="fas fa-graduation-cap"></i>
                    </div>
                    <div>
                      <div class="meta-label" style="margin-bottom: 2px;">Ngành đào tạo</div>
                      <div style="font-size: clamp(16px, 3vw, 22px); font-weight: 800; color: var(--primary); margin-bottom: 8px; white-space: nowrap;">KỸ THUẬT PHỤC HỒI CHỨC NĂNG</div>
                      <span class="status-badge badge-gray" style="font-family: monospace; font-size: 14px; padding: 6px 14px; font-weight:bold; letter-spacing:1px; border-color: var(--border);">MÃ: 7720603</span>
                    </div>
                  </div>

                  <!-- Right: Chỉ tiêu, Học phí, Tổ hợp môn xếp dọc -->
                  <div class="top-info-right">
                    <div style="background: var(--bg-page); border: 1px solid var(--border-light); padding: 12px 16px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center;">
                      <span class="meta-label" style="text-transform: none;">Chỉ tiêu tuyển sinh:</span>
                      <span style="font-size: 16px; font-weight: 800; color: var(--primary);">100</span>
                    </div>
                    <div style="background: var(--bg-page); border: 1px solid var(--border-light); padding: 12px 16px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center;">
                      <span class="meta-label" style="text-transform: none;">Học phí dự kiến:</span>
                      <span style="font-size: 15px; font-weight: 700; color: var(--text-dark);">48.000.000 đ/năm</span>
                    </div>
                    
                    <!-- Khối Tổ hợp môn (Căn trái, riêng biệt từng dòng) -->
                    <div style="background: var(--bg-page); border: 1px solid var(--border-light); padding: 14px 16px; border-radius: 10px; display: flex; flex-direction: column; gap: 8px;">
                      <span class="meta-label" style="text-transform: none; margin-bottom: 4px;">Tổ hợp xét tuyển:</span>
                      <div style="display: flex; flex-direction: column; gap: 8px; padding-left: 5px;">
                          <div style="font-size: 14px; color: var(--text-dark); display: flex; align-items: center; gap: 8px;">
                              <span style="font-weight: 700; width: 35px; color: var(--primary);">A00</span> 
                              <span style="color: var(--text-muted);">(Toán, Lý, Hóa)</span>
                          </div>
                          <div style="font-size: 14px; color: var(--text-dark); display: flex; align-items: center; gap: 8px;">
                              <span style="font-weight: 700; width: 35px; color: var(--primary);">B00</span> 
                              <span style="color: var(--text-muted);">(Toán, Hóa, Sinh)</span>
                          </div>
                          <div style="font-size: 14px; color: var(--text-dark); display: flex; align-items: center; gap: 8px;">
                              <span style="font-weight: 700; width: 35px; color: var(--primary);">D07</span> 
                              <span style="color: var(--text-muted);">(Toán, Hóa, Anh)</span>
                          </div>
                      </div>
                    </div>
                  </div>
                  
                  <!-- Action Button -->
                  <div class="top-info-action">
                    <a href="https://ump.edu.vn/uploads/ckeditor/files/Truong/DaoTaoDaiHoc/TuyenSinh/2026/1608_06042026_Thongtintuyensinh2026.pdf" 
                       target="_blank" 
                       class="btn-custom btn-custom-primary" style="width: 100%; max-width: 400px; padding: 12px;">
                      <i class="fas fa-external-link-alt"></i> Xem chi tiết công văn tuyển sinh
                    </a>
                  </div>
                </div>

                <!-- CHỌN CHUYÊN NGÀNH -->
                <div>
                  <div style="text-align: center; color: var(--text-muted); font-size: 13px; font-style: italic; margin-bottom: 15px;">* Sinh viên được chọn 1 trong 3 chuyên ngành để đào tạo chuyên sâu</div>
                  <div class="major-tabs-container">
                    ${majorButtonsHtml}
                  </div>
                </div>

                <!-- THÔNG TIN CHUYÊN NGÀNH -->
                <div class="plan-overview-card" style="border: 2px solid var(--primary); background: var(--bg-page);">
                  <h2 class="plan-title-large" style="margin-bottom: 12px; color: var(--primary);">${majors[activeMajor].name}</h2>
                  <p class="plan-description" style="margin-bottom: 20px; color: var(--text-dark);">"${majors[activeMajor].description}"</p>
                  <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <span class="status-badge badge-gray" style="background: white;"><i class="far fa-clock" style="color: var(--text-muted);"></i> 4 năm (8 học kỳ)</span>
                    <span class="status-badge badge-gray" style="background: white;"><i class="fas fa-bullseye" style="color: var(--text-muted);"></i> 130 tín chỉ</span>
                  </div>
                </div>

                <!-- CƠ HỘI VIỆC LÀM -->
                <div class="plan-overview-card">
                  <h3 class="status-section-title" style="margin-top: 0; border-bottom: 1px dashed var(--border-light); padding-bottom: 15px;">
                      <div style="background: var(--primary-light); color: var(--primary); padding: 8px 12px; border-radius: 8px;"><i class="fas fa-briefcase"></i></div> 
                      Cơ hội việc làm
                  </h3>
                  <ul style="margin: 0; padding: 0;">
                    ${jobsHtml}
                  </ul>
                </div>

                <!-- KHUNG CHƯƠNG TRÌNH -->
                <div style="margin-bottom: 40px;">
                  <h3 class="status-section-title" style="border: none;">
                    <i class="fas fa-book-open" style="color: var(--primary);"></i> Khung Chương Trình Đào Tạo
                  </h3>
                  <div class="task-list">
                      ${semestersHtml}
                  </div>
                </div>

                <!-- NÚT FANPAGE (Luôn hiện đầy đủ chữ) -->
                <a href="https://www.facebook.com/BomonPhuchoichucnang" target="_blank" class="btn-custom btn-custom-primary shadow-lg" style="position: fixed; bottom: 24px; right: 24px; z-index: 100; border-radius: 999px; padding: 12px 24px; box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4);">
                  <i class="fab fa-facebook" style="font-size: 20px;"></i>
                  <span style="font-weight: 600; margin-left: 4px;">Theo dõi Fanpage</span>
                </a>
            `;
        }

        // Khởi chạy khi load xong
        document.addEventListener("DOMContentLoaded", () => {
            renderApp();
        });

    </script>
</body>
</html>
