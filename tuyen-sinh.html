                  <div className="text-sm text-center text-gray-500 italic mb-3">* Sinh viên được chọn 1 trong 3 chuyên ngành để đào tạo chuyên sâu</div>
                  <div className="grid grid-cols-3 gap-2">
                    {Object.keys(majors).map(key => (
                      <button
                        key={key}
                        onClick={() => { setActiveMajor(key); setExpandedSemester(null); }}
                        className={`py-2.5 rounded-xl border-2 transition-all font-semibold text-xs sm:text-sm ${
                          activeMajor === key 
                            ? `${getColors(majors[key].color).border}${getColors(majors[key].color).light} text-gray-900 shadow-sm scale-[1.02]`
                            : 'bg-white border-gray-100 text-gray-500 hover:bg-gray-50'
                        }`}
                      >
                        {majors[key].name}
                      </button>
                    ))}
                  </div>
                </div>

                {/* THÔNG TIN CHUYÊN NGÀNH */}
                <div className={`p-5 sm:p-6 rounded-2xl mb-6 border-2 ${theme.border} ${theme.light}`}>
                  <h2 className="text-xl font-bold mb-2 text-gray-800">{majors[activeMajor].name}</h2>
                  <p className="text-gray-700 text-sm mb-4 leading-relaxed">"{majors[activeMajor].description}"</p>
                  <div className="flex gap-4 text-sm font-medium text-gray-600 bg-white p-3 rounded-lg border shadow-sm w-fit">
                    <span className="flex items-center gap-2"><Clock className="w-4 h-4" /> 4 năm (8 học kỳ)</span>
                    <span className="flex items-center gap-2 border-l pl-4"><Target className="w-4 h-4" /> 130 tín chỉ</span>
                  </div>
                </div>

                <div className="bg-white border border-gray-200 rounded-2xl p-5 mb-8 shadow-sm">
                  <div className="flex items-center gap-3 mb-4 pb-3 border-b">
                    <div className={`p-2 rounded-lg ${theme.bg} ${theme.text}`}><Briefcase className="w-5 h-5" /></div>
                    <h3 className="text-lg font-bold text-gray-800">Cơ hội việc làm</h3>
                  </div>
                  <ul className="space-y-2 text-sm text-gray-700">
                    {majors[activeMajor].jobs.map((job, idx) => (
                      <li key={idx} className="flex items-start gap-2">
                        <span className={`mt-1.5 w-1.5 h-1.5 rounded-full ${theme.bg}`}></span> {job}
                      </li>
                    ))}
                  </ul>
                </div>

                {/* KHUNG CHƯƠNG TRÌNH */}
                <div className="space-y-3">
                  <h3 className="text-lg font-bold flex items-center gap-2 mb-4">
                    <BookOpen className="w-5 h-5 text-blue-600" /> Khung Chương Trình Đào Tạo
                  </h3>

                  {semesters.map((sem) => {
                    const subjects = curriculumDatabase[sem.key]?.filter(sub => !sub.tags || sub.tags.includes(activeMajor)) || [];
                    const isOpen = expandedSemester === sem.id;
                    
                    return (
                      <div key={sem.id} className={`bg-white rounded-xl border overflow-hidden ${isOpen ? `border-2 ${theme.border} shadow-sm` : 'border-gray-200 hover:border-gray-300'}`}>
                        <button onClick={() => setExpandedSemester(isOpen ? null : sem.id)} className="w-full px-5 py-4 flex items-center justify-between text-left">
                          <div className="flex items-center gap-3">
                            <div className={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold ${isOpen ? theme.bg + ' text-white' : 'bg-gray-100 text-gray-500'}`}>{sem.id}</div>
                            <span className={`font-semibold ${isOpen ? 'text-gray-900' : 'text-gray-700'}`}>{sem.title}</span>
                          </div>
                          <ChevronRight className={`w-5 h-5 text-gray-400 transition-transform ${isOpen ? 'rotate-90' : ''}`} />
                        </button>

                        {isOpen && (
                          <div className="px-5 pb-5">
                            <div className="overflow-x-auto">
                              <table className="w-full text-sm text-left border-collapse">
                                <thead>
                                  <tr className="text-gray-500 border-b">
                                    <th className="py-2 w-12">STT</th>
                                    <th className="py-2">Tên học phần</th>
                                    <th className="py-2 text-center w-32">Tín chỉ (LT+TH)</th>
                                  </tr>
                                </thead>
                                <tbody>
                                  {subjects.map((sub, idx) => (
                                    <tr key={sub.id} className="border-b last:border-0 hover:bg-gray-50">
                                      <td className="py-3 text-gray-500">{idx + 1}</td>
                                      <td className="py-3 font-medium text-gray-800">{sub.name}</td>
                                      <td className="py-3 text-center">
                                        <span className="font-bold">{sub.theory + sub.practice}</span>
                                        <span className="text-gray-400 text-xs ml-1">({sub.theory}+{sub.practice})</span>
                                      </td>
                                    </tr>
                                  ))}
                                </tbody>
                              </table>
                            </div>
                            <div className={`mt-3 p-3 rounded-lg text-xs flex justify-between items-center ${theme.light}`}>
                                <div className="flex items-center gap-1.5"><Info className="w-4 h-4" /> Tổng: <strong>{subjects.reduce((a, c) => a + c.theory + c.practice, 0)}</strong> tín chỉ</div>
                                <div className="text-gray-500 italic">*Khung chương trình 2025</div>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>

                {/* NÚT FANPAGE */}
                <a href="https://www.facebook.com/BomonPhuchoichucnang" target="_blank" className="fixed bottom-6 right-6 z-50 flex items-center gap-2 bg-[#1877F2] text-white px-4 py-3 rounded-full shadow-lg hover:-translate-y-1 transition-transform" style={{ textDecoration: 'none' }}>
                  <Facebook className="w-5 h-5 fill-current" />
                  <span className="text-sm font-medium hidden sm:block">Theo dõi fanpage cập nhật thông tin</span>
                  <span className="text-sm font-medium sm:hidden">Theo dõi Fanpage</span>
                </a>
            </div>
          );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
