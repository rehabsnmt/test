                const mTheme = getColors(majors[key].color);

                    : 'bg-white border-gray-100 text-gray-500 hover:bg-gray-50';

                        ${majors[key].name}
                    </button>
                `;
            }).join('');

                <li class="flex items-start gap-2">
                    <span class="mt-1.5 w-1.5 h-1.5 rounded-full ${theme.bg} flex-shrink-0"></span>

                </li>
            `).join('');

                const subjects = curriculumDatabase[sem.key]?.filter(sub => !sub.tags || sub.tags.includes(activeMajor)) || [];

                const totalCredits = subjects.reduce((a, c) => a + c.theory + c.practice, 0);
                
                let tableHtml = '';
                if (isOpen) {

                        <tr class="border-b last:border-0 hover:bg-gray-50 transition-colors">
                            <td class="py-3 text-gray-500 whitespace-nowrap">${idx + 1}</td>
                            <td class="py-3 font-medium text-gray-800 min-w-[150px]">${sub.name}</td>
                            <td class="py-3 text-center whitespace-nowrap">
                                <span class="font-bold">${sub.theory + sub.practice}</span>
                                <span class="text-gray-400 text-xs ml-1">(${sub.theory}+${sub.practice})</span>
                            </td>
                        </tr>
                    `).join('');

                    tableHtml = `
                        <div class="px-5 pb-5 animate-fade-in">
                            <div class="overflow-x-auto">
                                <table class="w-full text-sm text-left border-collapse">
                                    <thead>
                                        <tr class="text-gray-500 border-b">
                                            <th class="py-2 w-12 font-medium whitespace-nowrap">STT</th>
                                            <th class="py-2 font-medium whitespace-nowrap">Tên học phần</th>
                                            <th class="py-2 text-center w-32 font-medium whitespace-nowrap">Tín chỉ (LT+TH)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${rowsHtml}
                                    </tbody>
                                </table>
                            </div>
